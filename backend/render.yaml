services:
  - type: web
    name: lifeos-app
    runtime: python
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: DEBUG
        value: "false"
      - key: DATABASE_URL
        value: "sqlite+aiosqlite:///./lifeos.db"
      - key: DATABASE_URL_SYNC
        value: "sqlite:///./lifeos.db"
      - key: CORS_ORIGINS
        value: '["*"]'
